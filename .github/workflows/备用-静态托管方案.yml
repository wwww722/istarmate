name: 备用方案 - 静态托管到腾讯云 CloudBase（如主方案失败可手动触发）

on:
  workflow_dispatch:

jobs:
  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci || npm install

      - name: 临时修改 next.config.js 启用静态导出
        run: |
          cat > next.config.js << "EOF"
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            reactStrictMode: false,
            output: "export",
            images: { unoptimized: true },
            trailingSlash: true,
            experimental: {},
          };
          module.exports = nextConfig;
          EOF
          echo "✅ next.config.js 已临时修改为静态导出"
          cat next.config.js

      - name: 构建静态文件（注入环境变量）
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          echo "🔨 执行 npm run build..."
          npm run build 2>&1 | tail -50
          echo "--- 构建完成，检查产物目录 ---"
          if [ -d "out" ]; then
            ls -la out | head -20
            echo "✅ out 目录存在"
          else
            echo "⚠️ out 目录不存在，可能构建失败或这是SSR项目"
          fi

      - name: 安装 CloudBase CLI
        run: npm install -g @cloudbase/cli@latest

      - name: 登录 CloudBase 并部署静态网站（仅当out目录存在时）
        if: hashFiles('out/index.html') != ''
        env:
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          echo "🔑 登录 CloudBase..."
          cloudbase login --apiKeyId $TENCENTCLOUD_SECRETID --apiKey $TENCENTCLOUD_SECRETKEY
          echo "🚀 部署静态网站..."
          cloudbase hosting:deploy ./out -e $TCB_ENV_ID
          echo "✅ 静态网站部署完成！"
